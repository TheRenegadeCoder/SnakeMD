name: Poetry Testing

on:
  pull_request:
    branches: [main]

jobs:
  all:

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        poetry-version: ["2.1"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Poetry Image
      uses: abatilo/actions-poetry@v2
      with:
        poetry-version: ${{ matrix.poetry-version }}

    - name: Install Dependencies
      run: poetry install

    - name: Install typing verification tools
      if: matrix.os == 'ubuntu-latest'
      run: |
        python -m venv "$RUNNER_TEMP/snakemd-typing-tools"
        "$RUNNER_TEMP/snakemd-typing-tools/bin/python" -m pip install -r tests/typing/requirements.txt

    - name: Check typing in installed distributions
      if: matrix.os == 'ubuntu-latest'
      run: |
        "$RUNNER_TEMP/snakemd-typing-tools/bin/python" tests/check_installed_typing.py

    - name: PyTest
      run: poetry run coverage run -m pytest

    - name: Coverage
      run: poetry run coverage report -m

    - name: PyLint
      run: poetry run pylint snakemd

    - name: Doctest
      run: |
        cd docs
        poetry run make doctest
